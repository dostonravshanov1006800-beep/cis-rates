name: Long history
# Раз в сутки собирает 365 дней истории для графиков 1М / 3М / 1Г (валюты и крипта) и кладёт в docs/data/longhist.json
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: longhist
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Collect
        run: python scripts/fetch_longhist.py
      - name: Sanity check (не публикуем пустой или битый файл)
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open("data/longhist.json"))
          assert len(d["days"])>=300, "мало дней"
          assert len(d["fx"])>=20, "мало валют"
          assert len(d["crypto"])>=15, "мало монет"
          print("ок:", len(d["days"]), "дней,", len(d["fx"]), "валют,", len(d["crypto"]), "монет")
          PY
      - name: Publish
        run: |
          mkdir -p docs/data && cp data/longhist.json docs/data/longhist.json
          git config user.name rates-bot && git config user.email bot@users.noreply.github.com
          git add data/longhist.json docs/data/longhist.json
          git diff --cached --quiet && { echo "без изменений"; exit 0; }
          git commit -qm "longhist $(date -u +%F)"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          echo "не удалось записать после 5 попыток"; exit 1
