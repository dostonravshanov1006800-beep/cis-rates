name: Probe bot
on: workflow_dispatch
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: getMe и webhook
        env: { BOT_TOKEN: "${{ secrets.BOT_TOKEN }}" }
        run: |
          curl -s "https://api.telegram.org/bot${BOT_TOKEN}/getMe" | python3 -c "import sys,json;d=json.load(sys.stdin);print('getMe ok=',d.get('ok'),'user=',d.get('result',{}).get('username'),d.get('description',''))"
          curl -s "https://api.telegram.org/bot${BOT_TOKEN}/getWebhookInfo" | python3 -c "import sys,json;r=json.load(sys.stdin).get('result',{});u=r.get('url') or '';print('webhook:',('есть, хост '+u.split('/')[2]) if u else 'ПУСТО','| ожидают:',r.get('pending_update_count'),'| ошибка:',r.get('last_error_message'))"
          curl -s "https://api.telegram.org/bot${BOT_TOKEN}/getMyCommands" | python3 -c "import sys,json;print('команды:',[c['command'] for c in json.load(sys.stdin).get('result',[])])"
