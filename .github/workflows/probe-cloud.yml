name: Probe cloud
on: workflow_dispatch
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: сравнение облака и репозитория (только чтение)
        env: { TGCLOUD_TOKEN: "${{ secrets.TGCLOUD_TOKEN }}" }
        run: |
          npm ci --silent 2>/dev/null || npm install --silent
          npx tgcloud fetch 2>&1 | sed -E 's/app[0-9]+:[A-Za-z0-9_-]+/app<id>:<секрет>/g' | tail -4
          echo "=== status ==="; npx tgcloud status --no-pager 2>&1 | tail -25
          echo "=== diff ==="; npx tgcloud diff --no-pager 2>&1 | head -60
