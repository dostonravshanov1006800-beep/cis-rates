name: Deploy bot
# Выкладывает код бота (tgcloud/**) в облако Telegram и сразу проверяет inline-режим. Запускается при изменении кода бота или вручную.
on:
  push:
    branches: [main]
    paths: ["tgcloud/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-bot
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Push to Telegram cloud
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: |
          npm ci --silent 2>/dev/null || npm install --silent
          # в чистой среде нет снимка облака: сначала синхронизируем его (файлы проекта не трогаем), затем выкладываем только отличия
          npx tgcloud fetch
          npx tgcloud status || true
          npx tgcloud push || { echo "push не прошёл, смотрим отличия"; npx tgcloud diff | head -60; exit 1; }
          npx tgcloud status
      - name: Check bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          curl -fsS "https://api.telegram.org/bot${BOT_TOKEN}/getMe" | python3 -c "import sys,json;r=json.load(sys.stdin)['result'];print('bot',r['username'],'inline',r.get('supports_inline_queries'))"
          curl -fsS "https://api.telegram.org/bot${BOT_TOKEN}/getWebhookInfo" | python3 -c "import sys,json;r=json.load(sys.stdin)['result'];print('webhook',bool(r.get('url')),'pending',r.get('pending_update_count'),'error',r.get('last_error_message'))"
