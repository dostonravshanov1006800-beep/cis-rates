name: Update rates
on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "2-57/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python scripts/fetch_rates.py
      - run: pip install -q pillow numpy
      - name: Rates card image
        run: python scripts/render_card.py || echo 'карточка не обновлена, остаётся предыдущая'
      - name: Signals to channel
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python scripts/alerts.py
      - run: mkdir -p docs/data && cp data/rates.json data/history.json docs/data/
      - name: Commit
        run: |
          git config user.name "rates-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "update $(date -u +%H:%M)"
          git pull --rebase -q || true
          git push
      - name: Chain next run
        # always(): цепочка продолжается даже если сбор курсов упал, иначе одна ошибка её оборвёт
        if: always() && github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 200
          gh workflow run update.yml --repo "$GITHUB_REPOSITORY" || true
