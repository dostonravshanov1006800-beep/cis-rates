name: Update rates
on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "2-57/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python scripts/fetch_rates.py
      - name: 7-day series (sparklines)
        run: python scripts/fetch_series.py || true
      - run: pip install -q pillow numpy
      - name: Rates card image
        run: python scripts/render_card.py || echo 'карточка не обновлена, остаётся предыдущая'
      - name: Publish card image to orphan branch (history never grows)
        run: |
          [ -f docs/rates.png ] || exit 0
          d=$(mktemp -d); cp docs/rates.png "$d/rates.png"
          cd "$d" && git init -q -b cards && git config user.name rates-bot && git config user.email bot@users.noreply.github.com
          git add rates.png && git commit -qm "card $(date -u +%H:%M)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" cards || echo "ветка cards не обновлена"
      - name: Signals to channel
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python scripts/alerts.py
      - name: Live card in channel (edit one message)
        continue-on-error: true   # сбой Telegram не должен ронять обновление курсов, но в логе будет красный шаг
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python scripts/post_card.py
      - run: mkdir -p docs/data && cp data/rates.json data/history.json data/series.json docs/data/
      - name: Page version (cache busting for Telegram webview)
        run: |
          python3 - <<'PY'
          import hashlib,re,json
          s=open("docs/index.html",encoding="utf-8").read()
          core=re.sub(r'<meta name="app-version" content="[^"]*">\n?',"",s)
          v=hashlib.sha1(core.encode()).hexdigest()[:10]
          if 'name="app-version"' in s:
              s=re.sub(r'(<meta name="app-version" content=")[^"]*(">)',r'\g<1>'+v+r'\g<2>',s)
              open("docs/index.html","w",encoding="utf-8").write(s)
          json.dump({"v":v},open("docs/data/version.json","w"))
          print("версия страницы:",v)
          PY
      - name: Commit
        run: |
          git config user.name "rates-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git rm -rq --cached design/__pycache__ scripts/__pycache__ 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -qm "update $(date -u +%H:%M)"
          # если параллельно кто-то записал в репозиторий, подтягиваем изменения и повторяем, до 5 раз
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs -q origin main || { git rebase --abort 2>/dev/null; git reset -q --hard origin/main; git checkout -q origin/main -- . 2>/dev/null; true; }
            git push -q origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          echo "не удалось записать после 5 попыток"; exit 1
      - name: Chain next run (с проверкой и запасным токеном)
        # always(): цепочка продолжается даже если сбор курсов упал, иначе одна ошибка её оборвёт
        if: always() && github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_TOKEN2: ${{ secrets.CISRATES_GH_TOKEN }}
        run: |
          sleep 40
          # сколько запусков уже стоит в очереди/идёт (кроме текущего)
          waiting() { gh run list --repo "$GITHUB_REPOSITORY" --workflow update.yml --json status,databaseId -q "[.[]|select((.status==\"queued\" or .status==\"pending\" or .status==\"waiting\") and .databaseId!=${{ github.run_id }})]|length" 2>/dev/null || echo 0; }
          for i in 1 2 3; do
            [ "$(waiting)" != "0" ] && { echo "следующий запуск уже в очереди"; exit 0; }
            gh workflow run update.yml --repo "$GITHUB_REPOSITORY" && echo "звено $i: запущен основным токеном" || {
              [ -n "$GH_TOKEN2" ] && GH_TOKEN="$GH_TOKEN2" gh workflow run update.yml --repo "$GITHUB_REPOSITORY" && echo "звено $i: запущен запасным токеном"; }
            sleep 8
          done
          [ "$(waiting)" != "0" ] && exit 0 || echo "ВНИМАНИЕ: следующий запуск не подтверждён, подхватит Watchdog"; exit 0
