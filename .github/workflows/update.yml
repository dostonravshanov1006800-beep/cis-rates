name: Update rates
on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "2-57/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python scripts/fetch_rates.py
      - name: 7-day series (sparklines)
        run: python scripts/fetch_series.py || true
      - run: pip install -q pillow numpy
      - name: Rates card image
        run: python scripts/render_card.py || echo 'карточка не обновлена, остаётся предыдущая'
      - name: Publish card image to orphan branch (history never grows)
        run: |
          [ -f docs/rates.png ] || exit 0
          d=$(mktemp -d); cp docs/rates.png "$d/rates.png"
          cd "$d" && git init -q -b cards && git config user.name rates-bot && git config user.email bot@users.noreply.github.com
          git add rates.png && git commit -qm "card $(date -u +%H:%M)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" cards || echo "ветка cards не обновлена"
      - name: Signals to channel
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python scripts/alerts.py
      - name: Live card in channel (edit one message)
        continue-on-error: true   # сбой Telegram не должен ронять обновление курсов, но в логе будет красный шаг
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python scripts/post_card.py
      - run: mkdir -p docs/data && cp data/rates.json data/history.json data/series.json docs/data/
      - name: Commit
        run: |
          git config user.name "rates-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git rm -rq --cached design/__pycache__ scripts/__pycache__ 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -qm "update $(date -u +%H:%M)"
          # если параллельно кто-то записал в репозиторий, подтягиваем изменения и повторяем, до 5 раз
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs -q origin main || { git rebase --abort 2>/dev/null; git reset -q --hard origin/main; git checkout -q origin/main -- . 2>/dev/null; true; }
            git push -q origin HEAD:main && exit 0
            sleep $((i * 3))
          done
          echo "не удалось записать после 5 попыток"; exit 1
      - name: Chain next run
        # always(): цепочка продолжается даже если сбор курсов упал, иначе одна ошибка её оборвёт
        if: always() && github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 40
          gh workflow run update.yml --repo "$GITHUB_REPOSITORY" || true
