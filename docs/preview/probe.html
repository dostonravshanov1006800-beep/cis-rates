<!doctype html><meta charset="utf-8"><title>PROBE</title><body><pre id="o">start</pre><script>
const o=document.getElementById('o'),log=m=>{o.textContent+='\n'+m;document.title='PROBE|'+o.textContent.replace(/\n/g,' ; ').slice(0,300)};
function t(name,url,sub){return new Promise(r=>{let n=0,tm=Date.now();let w;try{w=new WebSocket(url)}catch(e){log(name+' исключение '+e.message);return r()}
 w.onopen=()=>{log(name+' открыт '+(Date.now()-tm)+'мс');if(sub)w.send(JSON.stringify(sub))};
 w.onmessage=()=>{n++;if(n===1)log(name+' данные пошли')};
 w.onerror=()=>log(name+' ОШИБКА');w.onclose=e=>{log(name+' закрыт код '+e.code);r()};
 setTimeout(()=>{log(name+' итого сообщений '+n);try{w.close()}catch(e){}},6000)})}
t('BINANCE','wss://data-stream.binance.vision/stream?streams=btcusdt@miniTicker');
t('GATE','wss://api.gateio.ws/ws/v4/',{time:1,channel:'spot.tickers',event:'subscribe',payload:['BTC_USDT']});
</script>
